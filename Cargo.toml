
[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters/store-sqlite",
    "crates/adapters/embed-fastembed",
    "crates/infrastructure",
    "crates/app",
    "xtask",
]

[workspace.package]
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
fastembed = "6.0.0"
proptest = "1.7"
rstest = "0.25"
rusqlite = { version = "0.28", features = ["bundled", "load_extension"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlite-vector-rs = { path = "vendor/sqlite-vector-rs", default-features = false }
sqlite3_ext = { version = "0.2.1", features = ["with_rusqlite"] }
tempfile = "3.20"
thiserror = "2.0"
yaml-rust2 = { version = "0.11", default-features = false }

kv-domain = { path = "crates/domain" }
kv-application = { path = "crates/application" }
kv-store-sqlite = { path = "crates/adapters/store-sqlite" }
kv-embed-fastembed = { path = "crates/adapters/embed-fastembed" }
kv-infrastructure = { path = "crates/infrastructure" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
float_cmp = "deny"
indexing_slicing = "warn"
cognitive_complexity = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
undocumented_unsafe_blocks = "deny"
